<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: Tahoma, sans-serif; font-size: 13px; padding: 12px; background: #fff; color: #111; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; padding: 7px 0; cursor: pointer; border-bottom: 1px solid #eee; }
  input { accent-color: #f00; width: 16px; height: 16px; }
  .note { color: #666; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<h1>تمرکز یوتیوب</h1>
<label><input type="checkbox" id="skipAds"> رد خودکار تبلیغات</label>
<label><input type="checkbox" id="hideSidebar"> مخفی‌کردن پیشنهادهای کناری</label>
<label><input type="checkbox" id="hideShorts"> مخفی‌کردن شورتس</label>
<label><input type="checkbox" id="hideComments"> مخفی‌کردن کامنت‌ها</label>
<label><input type="checkbox" id="hideEndscreen"> مخفی‌کردن پیشنهادهای پایان ویدیو</label>
<label><input type="checkbox" id="hideHomeFeed"> مخفی‌کردن فید صفحه اصلی</label>
<p class="note">تغییرات بلافاصله اعمال می‌شن؛ نیازی به رفرش نیست.</p>
<script src="popup.js"></script>
</body>
</html>
